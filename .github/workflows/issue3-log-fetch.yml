name: Issue 3 log fetch

on:
  push:
    branches:
      - "diagnostics/issue-3-log-fetch"

permissions:
  contents: read

jobs:
  inspect-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Clone test-version and 1.13 map reference
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch test-version --single-branch https://github.com/Ender168/Vic3_mp_mod.git /tmp/repo
          git clone -q https://github.com/Victoria-3-Modding-Co-op/Community-State-Framework.git /tmp/csf

      - name: Validate state history against 1.13 state-region map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,collections
          mod=pathlib.Path('/tmp/repo/common/history/states/00_states.txt').read_text(encoding='utf-8-sig')
          refdir=pathlib.Path('/tmp/csf/docs/1.13 State Regions')
          if not refdir.exists():
              print('REFDIR_MISSING', list(pathlib.Path('/tmp/csf/docs').iterdir())[:30]); raise SystemExit(1)
          # Parse exact 1.13 state region province membership.
          ref='\n'.join(p.read_text(encoding='utf-8-sig') for p in sorted(refdir.glob('*.txt')))
          sr_re=re.compile(r'(?m)^\s*(STATE_[A-Z0-9_]+)\s*=\s*\{')
          prov_re=re.compile(r'\bx[0-9A-Fa-f]{6}\b')
          srs=list(sr_re.finditer(ref)); membership={}
          for i,m in enumerate(srs):
              name=m.group(1); block=ref[m.start():srs[i+1].start() if i+1<len(srs) else len(ref)]
              pm=re.search(r'provinces\s*=\s*\{(.*?)\}',block,re.S)
              membership[name]=set(x.upper() for x in prov_re.findall(pm.group(1))) if pm else set()
          print('REF_STATE_REGIONS',len(membership))

          hist_re=re.compile(r'(?m)^\s*s:(STATE_[A-Z0-9_]+)\s*=\s*\{')
          create_re=re.compile(r'create_state\s*=\s*\{(.*?)\n\s*\}',re.S)
          hs=list(hist_re.finditer(mod)); wrong=[]; unknown=[]; zero_create=[]; counts=[]
          for i,m in enumerate(hs):
              name=m.group(1); block=mod[m.start():hs[i+1].start() if i+1<len(hs) else len(mod)]
              creates=list(create_re.finditer(block)); counts.append((name,len(creates)))
              if not creates: zero_create.append(name)
              if name not in membership:
                  unknown.append(name); continue
              allowed=membership[name]
              for ci,cm in enumerate(creates):
                  ps=[x.upper() for x in prov_re.findall(cm.group(1))]
                  bad=[p for p in ps if p not in allowed]
                  if bad: wrong.append((name,ci,bad))
          print('HISTORY_STATES',len(hs))
          print('UNKNOWN_STATE_REGION_COUNT',len(unknown),unknown)
          print('ZERO_CREATE_STATE_COUNT',len(zero_create),zero_create[:100])
          print('WRONG_STATE_MEMBERSHIP_COUNT',len(wrong))
          for x in wrong[:300]: print('WRONG_STATE_MEMBERSHIP',x)

          # Check coverage/duplicate ownership within each state against physical region.
          dup=[]; unowned=[]
          for i,m in enumerate(hs):
              name=m.group(1)
              if name not in membership: continue
              block=mod[m.start():hs[i+1].start() if i+1<len(hs) else len(mod)]
              allps=[]
              for cm in create_re.finditer(block): allps += [x.upper() for x in prov_re.findall(cm.group(1))]
              c=collections.Counter(allps)
              ds=sorted(p for p,n in c.items() if n>1)
              miss=sorted(membership[name]-set(allps))
              if ds: dup.append((name,ds))
              if miss: unowned.append((name,miss))
          print('STATE_WITH_DUP_OWNED_PROVINCES_COUNT',len(dup))
          for x in dup[:100]: print('DUP_IN_STATE',x)
          print('STATE_WITH_UNOWNED_PHYSICAL_PROVINCES_COUNT',len(unowned))
          for x in unowned[:100]: print('UNOWNED_IN_STATE',x)
          PY
