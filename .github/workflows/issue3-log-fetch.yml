name: Issue 3 log fetch

on:
  push:
    branches:
      - "diagnostics/issue-3-log-fetch"

permissions:
  contents: read

jobs:
  inspect-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare exact references
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch test-version --single-branch https://github.com/Ender168/Vic3_mp_mod.git /tmp/mod
          git clone -q --filter=blob:none --no-checkout https://github.com/settintotrieste/V3-Vanilla-Extract.git /tmp/van
          git -C /tmp/van sparse-checkout init --cone
          git -C /tmp/van sparse-checkout set game/common/country_definitions game/common/history/characters game/common/history/countries
          git -C /tmp/van checkout -q eba06b7e4c47741732d6eaa7698ba5a5c25716a1

      - name: Validate definitions and capital ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,collections
          root=pathlib.Path('/tmp/mod')
          st=(root/'common/history/states/00_states.txt').read_text(encoding='utf-8-sig')
          sr=re.compile(r'(?m)^\s*s:(STATE_[A-Z0-9_]+)\s*=\s*\{')
          cr=re.compile(r'create_state\s*=\s*\{(.*?)\n\s*\}',re.S)
          owners=collections.defaultdict(set)
          sms=list(sr.finditer(st))
          for i,m in enumerate(sms):
              sn=m.group(1); b=st[m.start():sms[i+1].start() if i+1<len(sms) else len(st)]
              for cm in cr.finditer(b):
                  owners[sn].update(re.findall(r'country\s*=\s*c:([A-Z0-9_]+)',cm.group(1)))
          active=set().union(*owners.values())

          # Parse country definitions.
          defs={}
          for p in pathlib.Path('/tmp/van/game/common/country_definitions').glob('*.txt'):
              s=p.read_text(encoding='utf-8-sig')
              ms=list(re.finditer(r'(?m)^([A-Z0-9_]{3})\s*=\s*\{',s))
              for i,m in enumerate(ms):
                  b=s[m.start():ms[i+1].start() if i+1<len(ms) else len(s)]
                  cap=re.search(r'capital\s*=\s*(STATE_[A-Z0-9_]+)',b)
                  typ=re.search(r'country_type\s*=\s*([a-z0-9_]+)',b)
                  tier=re.search(r'tier\s*=\s*([a-z0-9_]+)',b)
                  defs[m.group(1)]={'file':p.name,'capital':cap.group(1) if cap else None,'type':typ.group(1) if typ else None,'tier':tier.group(1) if tier else None}
          print('ACTIVE_COUNTRIES',len(active),'DEFINITIONS',len(defs))
          missing=sorted(active-set(defs))
          print('ACTIVE_WITHOUT_DEFINITION',len(missing),missing)

          modtags=set()
          for p in (root/'common/history/countries').glob('*.txt'):
              modtags.update(re.findall(r'(?m)^\s*c:([A-Z0-9_]+)\s*\?=\s*\{',p.read_text(encoding='utf-8-sig')))
          for tag in sorted(modtags):
              d=defs.get(tag)
              if not d:
                  print('MODTAG',tag,'NO_DEFINITION'); continue
              cap=d['capital']; capowners=sorted(owners.get(cap,set())) if cap else []
              print('MODTAG',tag,'TYPE',d['type'],'TIER',d['tier'],'CAPITAL',cap,'CAPITAL_OWNERS',capowners,'OWNS_CAPITAL',tag in capowners)

          # All active countries whose declared capital is not owned, to catch a second latent crash source.
          bad=[]
          for tag in sorted(active):
              d=defs.get(tag)
              if not d or not d['capital']: continue
              if tag not in owners.get(d['capital'],set()): bad.append((tag,d['capital'],sorted(owners.get(d['capital'],set()))))
          print('ACTIVE_CAPITAL_NOT_OWNED_COUNT',len(bad))
          for x in bad: print('ACTIVE_CAPITAL_NOT_OWNED',x)

          # Character history coverage for modified tags.
          chardir=pathlib.Path('/tmp/van/game/common/history/characters')
          for tag in sorted(modtags):
              count=0; files=[]
              pat=re.compile(r'(?m)^\s*c:'+tag+r'\s*\?=\s*\{')
              for p in chardir.glob('*.txt'):
                  s=p.read_text(encoding='utf-8-sig')
                  if pat.search(s):
                      files.append(p.name)
                      count += len(re.findall(r'create_character\s*=\s*\{',s))
              print('CHAR_HISTORY',tag,'FILES',files,'CREATE_CHARACTER_FILECOUNT_RAW',count)
          PY
