name: Issue 3 log fetch

on:
  push:
    branches:
      - "diagnostics/issue-3-log-fetch"

permissions:
  contents: read

jobs:
  inspect-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Download issue attachment
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/issue3.zip \
            "https://github.com/user-attachments/files/31908746/victoria3_01260806_153722.zip"
          echo "Downloaded bytes: $(stat -c%s /tmp/issue3.zip)"
          file /tmp/issue3.zip

      - name: Inspect crash window and metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue3
          unzip -q /tmp/issue3.zip -d /tmp/issue3
          root=/tmp/issue3/victoria3_01260806_153722

          echo "===== ARCHIVE FILE LIST ====="
          find "$root" -type f -printf '%P\n' | sort

          for f in "$root/exception.txt" "$root/meta.yml" "$root/pdx_settings.json"; do
            echo
            echo "===== FILE: ${f#$root/} ====="
            cat "$f" || true
          done

          for f in "$root/logs/debug.log" "$root/logs/error.log" "$root/logs/game.log"; do
            echo
            echo "===== CRASH WINDOW: ${f#$root/} ====="
            grep -E '^\[15:37:(0[8-9]|1[0-9]|2[0-4])\]' "$f" || true
            echo "===== LAST 120 LINES: ${f#$root/} ====="
            tail -n 120 "$f" || true
          done

          echo
          echo "===== MINIDUMP FILE INFO ====="
          file "$root/minidump.dmp" || true
          echo "===== MINIDUMP ASCII STRINGS: relevant tail ====="
          strings -a "$root/minidump.dmp" | grep -Ei 'victoria3|exception|access|state|country|building|pop|history|jomini|clausewitz|assert|error|fatal' | tail -n 300 || true
          echo "===== MINIDUMP UTF16 STRINGS: relevant tail ====="
          strings -el "$root/minidump.dmp" | grep -Ei 'victoria3|exception|access|state|country|building|pop|history|jomini|clausewitz|assert|error|fatal' | tail -n 300 || true
