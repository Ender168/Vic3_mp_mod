name: Issue 3 log fetch

on:
  push:
    branches:
      - "diagnostics/issue-3-log-fetch"

permissions:
  contents: read

jobs:
  inspect-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Audit country histories
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch test-version --single-branch https://github.com/Ender168/Vic3_mp_mod.git /tmp/repo
          cd /tmp/repo
          echo '===== COUNTRY HISTORY FILES ====='
          for f in common/history/countries/*.txt; do
            echo
            echo "===== $f ====="
            cat "$f"
          done
          echo
          echo '===== POLITICS/GOVERNMENT RELATED STATEMENTS ====='
          grep -RniE 'government|politic|law|interest_group|legitimacy|ruler|character|ideology|party|institution|technology|tech|monarch|republic|theocracy|corporate|distribution|voting|succession|regime' common/history/countries || true

      - name: Audit duplicate effects and suspicious values
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/repo
          python3 - <<'PY'
          import pathlib,re,collections
          paths=sorted(pathlib.Path('common/history/countries').glob('*.txt'))
          # Gather effect-like keys per country file. Repeated keys are often legal, but unexpected heavy duplication is useful.
          for p in paths:
              s=p.read_text(encoding='utf-8-sig')
              keys=re.findall(r'(?m)^\s*([a-zA-Z_][a-zA-Z0-9_:]*)\s*=\s*',s)
              c=collections.Counter(keys)
              print('FILE',p)
              print(' KEYS',dict(c))
              # country scope and top-level quoted identifiers for laws etc
              for pat,label in [
                (r'activate_law\s*=\s*law_type:([a-z0-9_]+)','LAW'),
                (r'law\s*=\s*law_type:([a-z0-9_]+)','LAW2'),
                (r'add_technology\s*=\s*([a-z0-9_]+)','TECH'),
                (r'set_government_type\s*=\s*([a-z0-9_]+)','GOV'),
                (r'set_ruling_interest_groups\s*=\s*\{([^}]*)\}','RULING_IG'),
                (r'interest_group:([a-z0-9_]+)','IG'),
              ]:
                vals=re.findall(pat,s,re.S)
                if vals: print(' ',label,vals)
          PY
