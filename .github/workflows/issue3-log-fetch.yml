name: Issue 3 log fetch

on:
  push:
    branches:
      - "diagnostics/issue-3-log-fetch"

permissions:
  contents: read

jobs:
  inspect-attachment:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare exact references
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --branch test-version --single-branch https://github.com/Ender168/Vic3_mp_mod.git /tmp/mod
          git clone -q --filter=blob:none --no-checkout https://github.com/settintotrieste/V3-Vanilla-Extract.git /tmp/van
          git -C /tmp/van sparse-checkout init --cone
          git -C /tmp/van sparse-checkout set game/common/history/countries game/common/history/characters game/common/laws game/common/scripted_effects game/common/government_types game/common/country_definitions
          git -C /tmp/van checkout -q eba06b7e4c47741732d6eaa7698ba5a5c25716a1

      - name: Confirm governance principle coverage of modified countries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,collections
          md=pathlib.Path('/tmp/mod/common/history/countries')
          vd=pathlib.Path('/tmp/van/game/common/history/countries')
          mod={p.name:p for p in md.glob('*.txt')}; van={p.name:p for p in vd.glob('*.txt')}; virtual=dict(van); virtual.update(mod)
          # exact 1.13.10 law groups
          law_to_group={}
          for p in pathlib.Path('/tmp/van/game/common/laws').rglob('*.txt'):
              s=p.read_text(encoding='utf-8-sig')
              ms=list(re.finditer(r'(?m)^\s*(law_[a-z0-9_]+)\s*=\s*\{',s))
              for i,m in enumerate(ms):
                  b=s[m.start():ms[i+1].start() if i+1<len(ms) else len(s)]
                  gm=re.search(r'group\s*=\s*(lawgroup_[a-z0-9_]+)',b)
                  if gm: law_to_group[m.group(1)]=gm.group(1)
          # scripted politics effects and their governance/distribution laws
          pe=(pathlib.Path('/tmp/van/game/common/scripted_effects/00_political_setup.txt').read_text(encoding='utf-8-sig'))
          effects={}
          ems=list(re.finditer(r'(?m)^\s*(effect_starting_politics_[a-z0-9_]+)\s*=\s*\{',pe))
          for i,m in enumerate(ems):
              b=pe[m.start():ems[i+1].start() if i+1<len(ems) else len(pe)]
              effects[m.group(1)]=re.findall(r'activate_law\s*=\s*law_type:([a-z0-9_]+)',b)
          tags=set()
          for p in mod.values(): tags.update(re.findall(r'(?m)^\s*c:([A-Z0-9_]+)\s*\?=\s*\{',p.read_text(encoding='utf-8-sig')))
          for tag in sorted(tags):
              explicit=[]; effs=[]; files=[]
              pat=re.compile(r'(?m)^\s*c:'+tag+r'\s*\?=\s*\{')
              for name,p in sorted(virtual.items()):
                  s=p.read_text(encoding='utf-8-sig'); ms=list(re.finditer(r'(?m)^\s*c:([A-Z0-9_]+)\s*\?=\s*\{',s))
                  for i,m in enumerate(ms):
                      if m.group(1)!=tag: continue
                      b=s[m.start():ms[i+1].start() if i+1<len(ms) else len(s)]
                      files.append(name)
                      explicit += re.findall(r'activate_law\s*=\s*law_type:([a-z0-9_]+)',b)
                      effs += re.findall(r'\b(effect_starting_politics_[a-z0-9_]+)\s*=\s*yes',b)
              laws=list(explicit)
              for e in effs: laws += effects.get(e,[])
              gov=[l for l in laws if law_to_group.get(l)=='lawgroup_governance_principles']
              dop=[l for l in laws if law_to_group.get(l)=='lawgroup_distribution_of_power']
              print('TAG',tag,'FILES',files,'EFFECTS',effs,'GOV',gov,'DISTRIBUTION',dop)
          PY

      - name: Inspect all Sokoto references and capital ownership
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mod
          echo '===== MOD SOK REFERENCES ====='
          grep -RniE '\bc:SOK\b|\bSOK\b|STATE_SOKOTO' . --include='*.txt' --include='*.json' --include='*.yml' || true
          echo '===== VANILLA SOK CHARACTER REFERENCES ====='
          grep -RniE '\bc:SOK\b|\bSOK\b|STATE_SOKOTO' /tmp/van/game/common/history/characters || true
          echo '===== VANILLA SOK COUNTRY DEFINITION ====='
          grep -Rni -A30 -B3 'SOK' /tmp/van/game/common/country_definitions || true
          echo '===== TEST-VERSION SOK STATE HISTORY ====='
          grep -n -A120 -B5 's:STATE_SOKOTO' common/history/states/00_states.txt || true
